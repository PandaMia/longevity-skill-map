<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Longevity Skill Map</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div id="app">
    <header>
      <div class="brand">
        <strong>Longevity Skill Map</strong>
        <span id="meta">Loading graph…</span>
      </div>
      <div class="legend" aria-label="Edge types">
        <span class="legend-item"><i class="legend-line"></i> prerequisite</span>
        <span class="legend-item"><i class="legend-line recommended"></i> recommended</span>
        <span class="legend-item"><i class="legend-line applied"></i> applied in</span>
      </div>
      <div class="toolbar">
        <button id="fit" type="button">Fit graph</button>
        <button id="legend-toggle" type="button" aria-controls="legend-panel" aria-expanded="false">Legend</button>
        <button id="zoom-in" type="button" aria-label="Zoom in">＋</button>
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
      </div>
    </header>
    <main id="stage">
      <svg id="graph" role="img" aria-label="Longevity skill graph">
        <defs>
          <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="context-stroke"></path>
          </marker>
        </defs>
        <g id="viewport">
          <g id="lanes"></g>
          <g id="edges"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div id="loading">Loading the static layout…</div>
      <div id="error" hidden></div>
      <aside id="details" hidden aria-live="polite">
        <div class="panel-head">
          <div class="panel-head-copy">
            <h2 id="detail-title"></h2>
            <p id="detail-id"></p>
          </div>
          <button id="close-details" class="panel-close" type="button" aria-label="Close">×</button>
        </div>
        <div id="detail-body" class="panel-body"></div>
      </aside>
      <aside id="legend-panel" class="legend-panel" hidden aria-label="Legend">
        <div class="legend-panel-head">
          <h2>Legend</h2>
          <button id="close-legend" class="panel-close" type="button" aria-label="Close legend">×</button>
        </div>
        <div class="legend-panel-body">
          <section class="legend-section">
            <h3>Status dots</h3>
            <div id="status-legend-list" class="status-legend-grid"></div>
          </section>
          <section class="legend-section">
            <h3>Topic blocks</h3>
            <div id="topic-legend-list" class="topic-legend-grid"></div>
          </section>
        </div>
      </aside>
      <div class="hint">Trackpad: two fingers — pan · pinch — zoom · hover — edges · click — details</div>
    </main>
  </div>
  <script src="/static/app.js" defer></script>
</body>
</html>

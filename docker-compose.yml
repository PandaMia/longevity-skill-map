services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: longevity-skill-map:latest
    container_name: longevity-skill-map
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:18000:8000"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json, urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); assert json.load(response)['status'] == 'ok'"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
